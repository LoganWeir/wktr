[project]
name = "wktr"
version = "0.1.0"
description = "A tool to help manage git worktrees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wktr = "wktr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wktr"]

[tool.hatch.build.targets.wheel.package-data]
"wktr.shell" = ["*.zsh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
